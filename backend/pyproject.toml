[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-agent"
version = "0.1.0"
description = "Lana: a voice AI patient agent that calls clinics, negotiates, and books."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13",
    "elevenlabs>=1.0",
    "twilio>=9.0",
    # Windows ships no IANA time zone database; zoneinfo needs this for TIMEZONE.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[project.scripts]
agent = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits a real network API (skipped unless selected with -m live)",
]
addopts = "-m 'not live'"
